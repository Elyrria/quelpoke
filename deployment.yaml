apiVersion: v1
kind: Namespace
metadata:
  name: quentin

---
 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quelpoke-app
  namespace: quentin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quelpoke-app
  template:
    metadata:
      labels:
        app: quelpoke-app
    spec:
      containers:
        - name: quelpoke-app
          image: europe-west9-docker.pkg.dev/cs-poc-hpzdycpiqjyvinhrczvlwcn/student-quentin/quelpoke-app:v0.1
          ports:
          - containerPort: 8080
          env:
            - name: VERSION
              value: "v0.1"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080